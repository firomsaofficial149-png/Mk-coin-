<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple, fast to-do list with local storage." />
    <title>MK Tasks | To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="app-card" aria-labelledby="app-title">
        <header class="app-header">
          <div>
            <p class="kicker">MK COIN / PRODUCTIVITY</p>
            <h1 id="app-title">My to-do list<span>.</span></h1>
            <p class="subtitle">Keep your priorities clear and your progress moving.</p>
          </div>
          <div class="date-badge" aria-label="Today's date">
            <span id="day-number"></span>
            <span id="month-name"></span>
          </div>
        </header>

        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">Add a task</label>
          <input id="task-input" name="task" type="text" maxlength="120" placeholder="What needs to be done?" autocomplete="off" required />
          <button class="add-button" type="submit" aria-label="Add task">+</button>
        </form>

        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-button active" type="button" data-filter="all">All</button>
            <button class="filter-button" type="button" data-filter="active">Active</button>
            <button class="filter-button" type="button" data-filter="completed">Completed</button>
          </div>
          <button id="clear-completed" class="text-button" type="button">Clear completed</button>
        </div>

        <div id="empty-state" class="empty-state">
          <div class="empty-icon">✓</div>
          <h2>Nothing here yet</h2>
          <p>Add a task above and make today count.</p>
        </div>

        <ul id="task-list" class="task-list" aria-live="polite"></ul>

        <footer class="app-footer">
          <span id="task-count">0 tasks left</span>
          <span class="storage-note"><span class="status-dot"></span> Saved on this device</span>
        </footer>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
